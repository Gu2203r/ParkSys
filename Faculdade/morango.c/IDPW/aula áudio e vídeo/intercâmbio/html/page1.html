<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="../css/estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intercâmbio</title>
</head>
<body>

    <h3>Formulário intercâmbio</h3>

    <form>

        <label>Selecione o país de sua escolha :</label>

        <select name="País">

            <option value="Alemanha">Alemanha</option>

            <option value="Italia">Italia</option>

            <option value="EUA">Estados Unidos</option>

        </select><br><br>


        <label>Escolha a acomodação de sua preferencia :</label>

        <select name="acomodação">

            <option value="Ap">Apartamento</option>

            <option value="familia">Casa de família</option>

            <option value="campus">Campus da universidade</option>

        </select><br><br>


        <label>Escolha o período em que vai realizar o intercâmbio</label>


        
        <input type="radio" name="periodo" id="p">
        <label>Inicio</label>

        <input type="radio" name="periodo" id="p">
        <label>Fim</label><br><br>



        <label>Opções adicionais</label><br>

        <input type="checkbox" name="adicional" id="ad">
        <label>Café da manhã(opcional)</label><br>

        <input type="checkbox" name="adicional" id="ad">
        <label>Transporte para o aeroporto(opcional)</label>

        










        
        




























    </form>
    
</body>
</html>
