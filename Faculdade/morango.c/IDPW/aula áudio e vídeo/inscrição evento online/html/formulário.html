<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="../css/estilo.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Inscrição CutePet</h1>

    <form>

        <label for="name" >Insira seu nome :</label>
        <input type="text" name="nome" id="nome" autofocus><br><br><br>
        

        <label for="idade">Informe sua idade :</label>
        <input type="number" name="idade" id="idade" min="18" max="100"><br><br><br>

        <label for="email">Informe seu e-mail :</label>
        <input type="email" name="email" id="email">







    </form>
    



</body>
</html>
