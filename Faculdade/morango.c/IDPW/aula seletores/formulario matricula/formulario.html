<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>

    <h1>Formulário para matrícula</h1>
    
    <hr>

    <div class="formulário">
        <form>
            <label for="nome">Insira seu nome</label>

            <input type="text" name="nome" id="nome"><br>

            <label>Insira sua data de nascimento</label>

            <input type="date" name="data" id="d"><br>

            <label for="nome">Insira o numero do seu Registro Geral(RG)</label>

             <input type="text" name="RG" id="RG"><br>

             <label for="nome">Insira seu CPF</label>

             <input type="text" name="CPF" id="CPF">


            <div class="gênero">

                <label for="Gênero">Informe seu gênero</label>
                <input type="radio" name="gênero" value="f">
                <label>feminino</label>
                <input type="radio" name="gênero" value="m">
                <label >masculino</label>

            </div>

            <label for="nome">Insira seu Estado</label>

            <select name="cidade">

            <option value="SP">São Paulo</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="BA">Bahia</option>
            <option value="MG">Minas Gerais</option>
            <option value="RS">Rio Grande do Sul</option>
        
            </select><br>

            <label for="nome">Você cursou o ensimo médio em escola pública?</label>
            <input type="radio" name="opção" id="Sim">
            <label for="opção">Sim</label>
            <input type="radio" name="opção" id="Não">
            <label for="opção">Não</label><br>

            <label for="nome">Você possui alguma deficiência? Se sim, especifique qual.</label>
            <input type="text" name="especificação" id="especificação">

            





        </form>
    


</body>
</html>
